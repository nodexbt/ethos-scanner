name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow token only needs to read the repository. Nothing here
# writes to GitHub, so nothing in it can if a step is compromised.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=1000
      - run: npm test
